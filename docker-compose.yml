services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: anticheat_exam
      MYSQL_USER: anticheat
      MYSQL_PASSWORD: anticheat_pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.ngrok-free.app"
      DB_ENGINE: "django.db.backends.mysql"
      DB_NAME: "anticheat_exam"
      DB_USER: "anticheat"
      DB_PASSWORD: "anticheat_pass"
      DB_HOST: "db"
      DB_PORT: "3306"
      DJANGO_RELAX_MYSQL_VERSION: "1"
      DJANGO_SUPERUSER_USERNAME: "someone"
      DJANGO_SUPERUSER_EMAIL: "dummyacc5273@gmail.com"
      DJANGO_SUPERUSER_PASSWORD: "Qcf22bff1+2"
      # DJANGO_SECRET_KEY: "generate-a-real-one-for-anything-beyond-a-closed-LAN"
    restart: always

volumes:
  mysql_data:
