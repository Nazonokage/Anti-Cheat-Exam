{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="w-full max-w-lg my-6">
  <div class="glass rounded-3xl shadow-2xl p-8 border border-red-400/30 text-center">
    <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-red-500/10 border border-red-400/40 mb-4 text-red-200 text-2xl">
      !
    </div>
    <h1 class="text-3xl font-bold text-white">Access denied</h1>
    <p class="mt-3 text-sm text-examtext/75">{{ message }}</p>

    <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
      {% if user.is_authenticated %}
      <a href="{% url 'teacher_login' %}" class="inline-flex items-center justify-center rounded-xl holo-btn px-4 py-2.5 text-sm font-semibold text-black">
        Back to login
      </a>
      {% else %}
      <a href="{% url 'teacher_login' %}" class="inline-flex items-center justify-center rounded-xl holo-btn px-4 py-2.5 text-sm font-semibold text-black">
        Sign in
      </a>
      {% endif %}
      <a href="/" class="inline-flex items-center justify-center rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm font-medium text-examtext hover:bg-white/10">
        Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
