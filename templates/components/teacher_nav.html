<div class="w-full glass rounded-2xl px-5 py-3 mb-6 flex flex-wrap items-center justify-between gap-4 shadow-xl" style="border-color:rgba(52,211,153,.18);">

  <!-- Left: Brand + Exam Switcher -->
  <div class="flex items-center gap-4 flex-wrap">
    <a href="{% url 'teacher_dashboard' %}" class="flex items-center gap-2.5 font-bold text-white tracking-wide hover:text-examaccent transition-colors text-sm">
      <!-- System logo mark with bracket frame -->
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-xl bg-examprimary/20 border border-examprimary/40 text-examaccent" style="box-shadow:0 0 10px -3px rgba(16,185,129,.25);">
        <span class="nav-mark" aria-hidden="true"></span>
      </span>
      <span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.14em;display:block;color:rgba(52,211,153,.6);text-transform:uppercase;line-height:1;">ACE · MONITOR</span>
        <span class="text-xs font-semibold text-white leading-none">Teacher Portal</span>
      </span>
    </a>

    {% if all_exams %}
    <div class="flex items-center gap-2 pl-3 border-l border-white/10">
      <label for="exam-switcher" class="text-xs text-examtext/50 font-mono uppercase tracking-widest hidden sm:inline" style="font-size:.6rem;letter-spacing:.12em;">Exam</label>
      <select id="exam-switcher" onchange="if(this.value) location.href=this.value;"
              class="bg-white/5 text-xs text-white rounded-xl px-3 py-1.5 border border-white/15 focus:outline-none focus:ring-2 focus:ring-examprimary cursor-pointer max-w-[220px] sm:max-w-xs truncate">
        <option value="{% url 'teacher_dashboard' %}" class="bg-examsurface text-examtext/60">— All Exams —</option>
        {% for e in all_exams %}
        <option value="{% url 'teacher_monitor' e.id %}" class="bg-examsurface" {% if exam and exam.id == e.id %}selected{% endif %}>
          {% if e.is_active %}● {% else %}○ {% endif %}{{ e.title }} ({{ e.subject }})
        </option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
  </div>

  <!-- Right: Quick links + User -->
  <div class="flex items-center gap-2 text-xs">
    <a href="{% url 'teacher_dashboard' %}"
       class="px-3 py-1.5 rounded-xl border border-white/12 bg-white/5 hover:bg-examprimary/10 hover:border-examprimary/30 text-examtext/70 hover:text-examaccent transition-colors font-mono" style="font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;">
      Dashboard
    </a>
    <a href="{% url 'admin:index' %}" target="_blank"
       class="px-3 py-1.5 rounded-xl border border-white/12 bg-white/5 hover:bg-examprimary/10 hover:border-examprimary/30 text-examtext/70 hover:text-examaccent transition-colors font-mono" style="font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;">
      Admin
    </a>

    <div class="h-4 w-px bg-white/10 mx-1 hidden sm:block"></div>

    <span class="text-examtext/50 hidden md:inline font-mono" style="font-size:.65rem;letter-spacing:.05em;">
      <span style="color:rgba(52,211,153,.5);">UID ·</span> <strong class="text-white/70 font-medium">{{ request.user.username }}</strong>
    </span>
    <a href="{% url 'teacher_logout' %}"
       class="px-3 py-1.5 rounded-xl border border-red-400/25 bg-red-500/5 hover:bg-red-500/15 hover:border-red-400/50 text-red-300/70 hover:text-red-200 transition-colors font-mono" style="font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;">
      Logout
    </a>
  </div>
</div>
