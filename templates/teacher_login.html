{% extends "base.html" %}
{% block title %}Teacher Login{% endblock %}
{% block content %}
<div class="w-full max-w-md my-6">
  <div class="glass rounded-3xl shadow-2xl p-8 border border-white/15">
    <div class="mb-6 text-center">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-examprimary/20 border border-examprimary/40 mb-3 text-examaccent">
        <span class="nav-mark" aria-hidden="true"></span>
      </div>
      <h1 class="text-2xl font-bold text-white">Teacher Login</h1>
      <p class="text-xs text-examtext/70 mt-1">Use the staff account created for you by a superuser.</p>
    </div>

    {% if error %}
    <div class="mb-4 rounded-xl border border-red-400/40 bg-red-500/10 text-red-200 text-xs px-4 py-2.5">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <div>
        <label class="block text-xs mb-1 text-examtext/80 font-medium">Username</label>
        <input type="text" name="username" required autocomplete="username"
               class="w-full rounded-xl bg-white/5 border border-white/15 px-4 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-examprimary"
               placeholder="e.g. janedoe">
      </div>

      <div>
        <label class="block text-xs mb-1 text-examtext/80 font-medium">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full rounded-xl bg-white/5 border border-white/15 px-4 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-examprimary"
               placeholder="••••••••">
      </div>

      <button type="submit"
              class="w-full rounded-xl holo-btn text-black font-semibold py-2.5 transition-transform hover:scale-[1.01] text-sm mt-2">
        Sign in &rarr;
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-white/10 text-center text-xs text-examtext/60">
      Django Admin is at
      <a href="{% url 'admin:login' %}?next={% url 'admin:index' %}" class="text-examaccent hover:underline font-semibold ml-1">
        /admin/
      </a>
    </div>
  </div>
</div>
{% endblock %}
