services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8091,http://127.0.0.1:8091"
      DJANGO_RELAX_MYSQL_VERSION: "0"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      PORT: "8090"
    ports:
      - "127.0.0.1:8091:8090"
    entrypoint: ["bash", "/app/start.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
